# Include this job in the reviewed repository's .gitlab-ci.yml.
# CODE_REVIEW_IMAGE must point to the image built with Dockerfile --target runner.
# For a pipeline with no regular-stage MR jobs, use gitlab-code-review.standalone.yml.
# Add tags matching your Docker executor Runner when merging this job.
code-review:
  stage: .pre
  image:
    name: "$CODE_REVIEW_IMAGE"
    entrypoint: [""]
  needs: []
  dependencies: []
  before_script: []
  after_script: []
  cache: []
  variables:
    GIT_DEPTH: "0"
    GIT_SUBMODULE_STRATEGY: none
    GIT_LFS_SKIP_SMUDGE: "1"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_MERGE_REQUEST_PROJECT_ID'
    - when: never
  script:
    - node /app/dist/cli/review.js
  timeout: 20m
  interruptible: true
  allow_failure: true
